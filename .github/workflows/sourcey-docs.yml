name: Sourcey API docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "sourcey-docs/**"
      - ".github/workflows/sourcey-docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sourcey-docs/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install dependencies
        working-directory: sourcey-docs
        run: pnpm install --frozen-lockfile
      - name: Build API reference
        run: |
          cargo build --no-default-features
          cd sourcey-docs
          pnpm snapshot
          pnpm build
      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: sourcey-api-reference
          path: sourcey-docs/dist
