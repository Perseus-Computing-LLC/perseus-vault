name: Integrations

on:
  push:
    branches: [main, master]
    paths:
      - "integrations/**"
      - "docs/specs/integration-conformance-v1.md"
      - "scripts/validate_integration_conformance.py"
      - "tests/fixtures/integration_conformance_v1.json"
      - "tests/test_integration_conformance.py"
      - ".github/workflows/integrations.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "integrations/**"
      - "docs/specs/integration-conformance-v1.md"
      - "scripts/validate_integration_conformance.py"
      - "tests/fixtures/integration_conformance_v1.json"
      - "tests/test_integration_conformance.py"
      - ".github/workflows/integrations.yml"

jobs:
  conformance-contract:
    name: Validate integration conformance contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install contract test dependency
        run: python -m pip install pytest
      - name: Run contract tests
        run: python -m pytest tests/test_integration_conformance.py -q
      - name: Validate published fixture
        run: python scripts/validate_integration_conformance.py --fixture tests/fixtures/integration_conformance_v1.json

  ephemeral-admission-fixture:
    name: Real ephemeral admission fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build lean Vault binary
        run: cargo build --locked --no-default-features
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install client test dependencies
        run: |
          python -m pip install pytest
          python -m pip install ./integrations/client
      - name: Exercise public admitted write and recall path
        env:
          PERSEUS_VAULT_BIN: ${{ github.workspace }}/target/debug/perseus-vault
        run: python -m pytest integrations/client/tests/test_vault_client.py -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The shared stdio-transport client. Pure stdlib; its real-binary
          # test self-skips when perseus-vault isn't on PATH.
          - adapter: client
            extra_deps: ""
          # autogen & crewai tests stub their framework deps — no install needed.
          - adapter: autogen
            extra_deps: ""
          - adapter: crewai
            extra_deps: ""
          # praison tests drive a fake VaultClient and self-skip the Protocol
          # conformance check when praisonaiagents is absent — no install needed.
          - adapter: praison
            extra_deps: ""
          # langgraph adapter imports langgraph.store.base at module load,
          # so the real package must be present to collect the tests.
          - adapter: langgraph
            extra_deps: "langgraph"
          # perseus-vault-persist imports mcp.server.streamable_http at module load and
          # pins the SDK version (the EventStore ABC signature is version-specific).
          - adapter: perseus-vault-persist
            extra_deps: "mcp==1.28.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest pytest-asyncio ${{ matrix.extra_deps }}

      - name: Install perseus-vault-client (shared stdio transport)
        # The langgraph/crewai/autogen adapters import perseus_vault_client at
        # module load. It's a local path package (not published to PyPI), so it
        # must be installed from the repo. Harmless for adapters that don't use
        # it (e.g. perseus-vault-persist).
        run: pip install ./integrations/client

      - name: Run ${{ matrix.adapter }} adapter tests
        working-directory: integrations/${{ matrix.adapter }}
        run: python -m pytest tests/ -v
