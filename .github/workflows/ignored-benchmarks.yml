name: Ignored benchmark/probe lane

# #963: 7 #[ignore]d benchmark/probe tests were unwired — dead coverage for
# correctness-class probes (dedup-scan-vs-exhaustive is a correctness check).
# Weekly cron lane (Sunday 06:00 UTC, clear of scale-gate's Monday 100K) runs
# them all in release mode; workflow_dispatch for on-demand runs. These are
# measurements, not assertions, so the lane is diagnostic: failures surface
# drift in the printed metrics, not a red PR gate.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lean-probes:
    # Six probes are embedding-independent and run on the lean build
    # (--no-default-features), mirroring perf-gate's shape.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build (lean, release)
        run: cargo build --locked --release --no-default-features --tests
      - name: Run ignored probes (lean)
        run: |
          set -e
          for t in \
            bench_dedup_scan_stored_signatures_vs_exhaustive \
            vector_quant_bench_probe \
            stress_100k_entities_recall_and_decay \
            bench_401_fts_recall_selectivity \
            cohere_lock_window_measurement \
            expand_source_latency_probe; do
            echo "=== $t ==="
            cargo test --locked --release --no-default-features "$t" -- \
              --ignored --nocapture --test-threads=1
          done

  default-probes:
    # probe_write_latency_embed_on measures the write path with auto-embed
    # enabled, so it needs the default (ONNX) build.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build (default features, release)
        run: cargo build --locked --release --tests
      - name: Run probe_write_latency_embed_on
        run: |
          cargo test --locked --release probe_write_latency_embed_on -- \
            --ignored --nocapture --test-threads=1
