name: Bi-temporal gate

# Guards Perseus Vault's bi-temporal contract: time-travel (perseus_vault_as_of) returns the
# version that was live at a past instant, supersede moves the prior version to
# history, and current recall is live-only (a superseded version must never
# resurface). A single failing check means time-travel or supersede regressed,
# so this gate requires 100%. Fast, offline, no network or API key.

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "benchmark/temporal/**"
      - ".github/workflows/temporal-gate.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "benchmark/temporal/**"
      - ".github/workflows/temporal-gate.yml"

env:
  CARGO_TERM_COLOR: always
  PERSEUS_VAULT_BUNDLED_MODEL_DIR: ${{ github.workspace }}/.model-cache

jobs:
  temporal-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .model-cache
          key: minilm-l6-v2-qint8-v2
      - name: Fetch embedding model (if not cached)
        shell: bash
        run: |
          mkdir -p .model-cache
          base=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main
          [ -s .model-cache/model_qint8_avx512_vnni.onnx ] || curl -fL --retry 5 --retry-all-errors "$base/onnx/model_qint8_avx512_vnni.onnx" -o .model-cache/model_qint8_avx512_vnni.onnx
          [ -s .model-cache/tokenizer.json ] || curl -fL --retry 5 --retry-all-errors "$base/tokenizer.json" -o .model-cache/tokenizer.json
          cp .model-cache/model_qint8_avx512_vnni.onnx .model-cache/model_quantized.onnx
      - name: Build (release, bundled embeddings)
        run: cargo build --locked --release
      - name: Bi-temporal gate
        run: python benchmark/temporal/gate.py
