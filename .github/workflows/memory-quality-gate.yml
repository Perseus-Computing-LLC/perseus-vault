name: Memory quality gate

# #778: first-class memory-quality scenarios against the real Vault binary.
# Unlike latency benchmarks, this answers whether memory behavior is correct:
# durable recall, supersession, visibility, and adversarial demotion all must pass.

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "benchmark/quality/**"
      - ".github/workflows/memory-quality-gate.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "benchmark/quality/**"
      - ".github/workflows/memory-quality-gate.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  memory-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build (lean)
        run: cargo build --locked --no-default-features
      - name: Memory quality report
        # #966: PR verdicts are now blocking like pushes. The gate has been
        # green on pushes since the #898 recalibration, so an advisory PR
        # scorecard only allowed silent drift to merge.
        run: python benchmark/quality/run.py --out benchmark/quality/report.json
      - name: Build blocking release scorecard
        run: python benchmark/quality/scorecard.py benchmark/quality/report.json --out benchmark/quality/scorecard.json
      - name: Upload quality report and scorecard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-quality-scorecard
          path: |
            benchmark/quality/report.json
            benchmark/quality/scorecard.json
