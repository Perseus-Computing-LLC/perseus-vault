name: Docker

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Only authenticate + push on pushes to the default branch or tags.
      # PRs (including from forks) just build to verify the Dockerfile.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Local-only convenience tag for the smoke step (#967); it is
            # overwritten every run and never published meaningfully.
            type=raw,value=smoke

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # PR builds must land in the local docker daemon for the smoke step.
          load: true

      # #967: the image was built on every PR but never RUN — a broken
      # entrypoint/CMD or runtime-only failure sailed through. Smoke it with
      # an MCP stdio handshake against the default serve command.
      - name: Smoke — MCP stdio handshake inside the built image
        run: |
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run --rm -i "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:smoke")
          echo "$out"
          echo "$out" | grep -q '"protocolVersion"' || { echo "initialize failed"; exit 1; }
          echo "$out" | grep -q 'perseus_vault_remember' || { echo "tools/list missing perseus_vault_remember"; exit 1; }
